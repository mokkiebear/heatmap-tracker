name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      # Dates are a core concern of this plugin and several past bugs were
      # timezone-dependent, so the suite runs under non-UTC zones too.
      - name: Test (UTC)
        run: npm run test:utc

      - name: Test (America/New_York)
        run: npm run test:usa

      - name: Build
        run: npm run build
