name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow only checks out and builds. Without an explicit
# block the job inherits the repository default, which may be write-all.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      # Dates are a core concern of this plugin and several past bugs were
      # timezone-dependent. The runner is already UTC, so only a non-UTC zone
      # adds signal here.
      - name: Test (America/New_York)
        run: npm run test:usa

      - name: Build
        run: npm run build
