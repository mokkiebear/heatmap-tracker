name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

# `gh release create` needs write access to contents; `attestations: write` and
# `id-token: write` let the build sign the released files so anyone can verify
# they came from this workflow (`gh attestation verify main.js -R mokkiebear/heatmap-tracker`).
permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          awk -v ver="$tag" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Error: no CHANGELOG.md section found for tag $tag" >&2
            exit 1
          fi

          cat RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            build/main.js
            build/manifest.json
            build/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --notes-file=RELEASE_NOTES.md \
            ./build/main.js ./build/manifest.json ./build/styles.css
